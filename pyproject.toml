[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saf-py"
version = "0.1.0"
description = "Unofficial Python port of Shastin et al.'s surface-based SAF framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE.md", "NOTICE.md", "licenses/*", "src/safpy/saf_backend/LICENSE.md"]
dependencies = ["numpy>=1.23", "scipy>=1.9", "scikit-learn>=1.2", "nibabel>=5.0"]

[project.urls]
Repository = "https://github.com/ChengjinLii/SAF-Py"
"Original SAF Code" = "https://github.com/dmitrishastin/SAF"
"Original Paper" = "https://doi.org/10.1016/j.neuroimage.2022.119423"

[project.scripts]
saf-py = "safpy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"safpy.saf_backend" = ["LICENSE.md"]
